<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laya-omni 多模态决策</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #3867d6; --accent-soft: #e6edfb; --base: #c7ccd6; --good: #2e9e6b; --warn: #c9812f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1c2028; --ink: #e6e9ef; --muted: #939bab; --line: #2c323d;
    --accent: #6f93ea; --accent-soft: #243150; --base: #4a5160; --good: #4cc08e; --warn: #e0a15a;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1c2028; --ink: #e6e9ef; --muted: #939bab; --line: #2c323d;
  --accent: #6f93ea; --accent-soft: #243150; --base: #4a5160; --good: #4cc08e; --warn: #e0a15a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header button { margin-left: auto; }
main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; }
label.small { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
textarea, input[type=text], select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; background: var(--bg); color: var(--ink); font: inherit; }
textarea { resize: vertical; }
button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.thumb { position: relative; }
.thumb img { width: 88px; height: 88px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.thumb button { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
audio { width: 100%; margin-top: 8px; }
.q { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; }
.q .row select { width: auto; }
.toggles { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; color: var(--muted); }
.result { margin-bottom: 16px; }
.result h3 { font-size: 14px; margin: 0 0 6px; }
.bar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 56px; gap: 8px; align-items: center; margin: 3px 0; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .name.answer::after { content: " ✓"; color: var(--good); }
.track { position: relative; height: 18px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.fill { position: absolute; left: 0; top: 0; bottom: 6px; background: var(--accent); border-radius: 4px 4px 0 0; }
.base { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--base); }
.pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.gallery { grid-column: 1 / -1; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sets button.on { background: var(--accent-soft); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--bg); }
.card:hover { border-color: var(--accent); }
.card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
.card .audio-icon { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: var(--accent-soft); border-radius: 6px; }
.card .txt { font-size: 12px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.err { color: var(--warn); margin-top: 8px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>laya-omni</h1>
  <span class="sub">给 Laya 加上眼睛和耳朵：看图、听声，一次前向给出带概率的判断</span>
  <button id="theme" title="切换深浅色">◐</button>
</header>
<main>
  <section class="panel">
    <h2>输入</h2>
    <label class="small">图片（可多张，拖进来或点击选择）</label>
    <div class="drop" id="drop">拖放图片到这里，或点击选择</div>
    <input type="file" id="imgInput" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs"></div>

    <label class="small">音频</label>
    <div class="row">
      <button id="pickAudio">选择音频文件</button>
      <button id="rec">● 录音</button>
      <button id="clearAudio">清除</button>
    </div>
    <input type="file" id="audInput" accept="audio/*" hidden>
    <audio id="player" controls hidden></audio>

    <label class="small">状态文本（state，可留空或补充背景信息）</label>
    <textarea id="state" rows="2">Image.</textarea>

    <label class="small">问题</label>
    <div id="questions"></div>
    <div class="row" style="margin-top:8px"><button id="addQ">＋ 添加问题</button></div>

    <div class="toggles">
      <label><input type="checkbox" id="detail"> 细节模式（256 个图像 token，看图表 / 文档更准）</label>
      <label><input type="checkbox" id="compare" checked> 对比不看图 / 不听音的结果</label>
    </div>
    <button class="primary" id="run">运行</button>
    <div class="err" id="err"></div>
  </section>

  <section class="panel">
    <h2>结果</h2>
    <div class="legend"><span><i style="background:var(--accent)"></i>看图 / 听音后</span><span><i style="background:var(--base)"></i>不看不听（原版 Laya）</span></div>
    <div id="results" class="empty">上传图片或音频、写好问题后点「运行」，或从下面的样例开始。</div>
  </section>

  <section class="panel gallery">
    <h2>样例</h2>
    <div class="sets" id="sets"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { images: [], exampleImages: [], audio: null, exampleAudio: "", answer: null };

// theme
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
};

// images
function renderThumbs() {
  const box = $("thumbs"); box.innerHTML = "";
  const all = [...state.images.map((f, i) => ({ src: URL.createObjectURL(f), drop: () => state.images.splice(i, 1) })),
               ...state.exampleImages.map((p, i) => ({ src: "/api/media?path=" + encodeURIComponent(p), drop: () => state.exampleImages.splice(i, 1) }))];
  all.forEach((t) => {
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img src="${t.src}"><button>×</button>`;
    d.querySelector("button").onclick = () => { t.drop(); renderThumbs(); };
    box.appendChild(d);
  });
}
function addImages(files) { for (const f of files) if (f.type.startsWith("image/")) state.images.push(f); renderThumbs(); }
$("drop").onclick = () => $("imgInput").click();
$("imgInput").onchange = (e) => addImages(e.target.files);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); addImages(e.dataTransfer.files); };

// audio
function setAudio(blob, url) {
  state.audio = blob; state.exampleAudio = "";
  $("player").src = url || URL.createObjectURL(blob); $("player").hidden = false;
}
$("pickAudio").onclick = () => $("audInput").click();
$("audInput").onchange = (e) => { if (e.target.files[0]) setAudio(e.target.files[0]); };
$("clearAudio").onclick = () => { state.audio = null; state.exampleAudio = ""; $("player").hidden = true; $("player").removeAttribute("src"); };

// microphone recording, encoded to 16-bit WAV in the browser
let rec = null;
$("rec").onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext(); const src = ctx.createMediaStreamSource(stream);
    const node = ctx.createScriptProcessor(4096, 1, 1); const chunks = [];
    node.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(node); node.connect(ctx.destination);
    $("rec").textContent = "■ 停止";
    rec = { stop: () => {
      node.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop());
      const wav = encodeWav(chunks, ctx.sampleRate); ctx.close();
      setAudio(wav); rec = null; $("rec").textContent = "● 录音";
    } };
  } catch (e) { $("err").textContent = "无法使用麦克风：" + e.message + "（需要 https 或 localhost）"; }
};
function encodeWav(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44; for (const c of chunks) for (const x of c) { v.setInt16(o, Math.max(-1, Math.min(1, x)) * 0x7fff, true); o += 2; }
  return new Blob([buf], { type: "audio/wav" });
}

// questions editor
function addQuestion(q = { type: "choice", instructions: "", criteria: [] }) {
  const d = document.createElement("div"); d.className = "q";
  const opts = Array.isArray(q.criteria) ? q.criteria : Object.keys(q.criteria || {});
  d.innerHTML = `<div class="row"><select><option value="choice">choice 选择</option><option value="score">score 分级</option><option value="noul">noul 是非</option></select>
    <button class="del" style="margin-left:auto">删除</button></div>
    <label class="small">问题</label><input type="text" class="ins">
    <label class="small opt-l">选项（一行一个；score 按从低到高）</label><textarea class="opts" rows="3"></textarea>`;
  d.querySelector("select").value = q.type;
  d.querySelector(".ins").value = q.instructions || "";
  d.querySelector(".opts").value = opts.join("\n");
  const sync = () => { const noul = d.querySelector("select").value === "noul"; d.querySelector(".opts").hidden = noul; d.querySelector(".opt-l").hidden = noul; };
  d.querySelector("select").onchange = sync; sync();
  d.querySelector(".del").onclick = () => d.remove();
  $("questions").appendChild(d);
}
function readQuestions() {
  const out = {};
  [...document.querySelectorAll(".q")].forEach((d, i) => {
    const type = d.querySelector("select").value, ins = d.querySelector(".ins").value.trim();
    const opts = d.querySelector(".opts").value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!ins) return;
    out["q" + (i + 1)] = type === "noul" ? { type, instructions: ins } : { type, instructions: ins, criteria: opts };
  });
  return out;
}
$("addQ").onclick = () => addQuestion();
addQuestion({ type: "choice", instructions: "What is shown in this image?", criteria: ["a cat", "a dog", "a car", "food"] });

// run
$("run").onclick = async () => {
  $("err").textContent = ""; const qs = readQuestions();
  if (!Object.keys(qs).length) { $("err").textContent = "至少写一个问题"; return; }
  const fd = new FormData();
  fd.append("state", $("state").value); fd.append("questions", JSON.stringify(qs));
  state.images.forEach((f) => fd.append("images", f));
  fd.append("example_images", state.exampleImages.join("|"));
  if (state.audio) fd.append("audio", state.audio, state.audio.name || "audio.wav");
  fd.append("example_audio", state.exampleAudio);
  fd.append("detail", $("detail").checked); fd.append("compare", $("compare").checked);
  $("run").disabled = true; $("run").textContent = "运行中…";
  try {
    const r = await fetch("/api/predict", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    showResults(j, qs);
  } catch (e) { $("err").textContent = "出错了：" + e.message; }
  $("run").disabled = false; $("run").textContent = "运行";
};

function showResults(j, qs) {
  const box = $("results"); box.className = ""; box.innerHTML = "";
  for (const [id, a] of Object.entries(j.result.answers)) {
    const base = j.baseline ? j.baseline.answers[id] : null, q = qs[id];
    const probs = a.type === "noul" ? { "是 true": a.noul, "否 false": 1 - a.noul } : a.probabilities;
    const bprobs = !base ? null : base.type === "noul" ? { "是 true": base.noul, "否 false": 1 - base.noul } : base.probabilities;
    const labels = a.type === "score" ? Object.keys(probs).map((k) => a.legend[k]) : Object.keys(probs);
    const d = document.createElement("div"); d.className = "result";
    const answerIdx = state.answer !== null && Object.keys(qs).length === 1 ? state.answer : null;
    d.innerHTML = `<h3>${escapeHtml(q.instructions)}</h3>`;
    Object.keys(probs).forEach((k, i) => {
      const p = probs[k], b = bprobs ? bprobs[k] : null;
      const isAns = answerIdx !== null && (a.type === "noul" ? (answerIdx === 1 ? i === 0 : i === 1) : i === answerIdx);
      d.insertAdjacentHTML("beforeend", `<div class="bar"><div class="name${isAns ? " answer" : ""}" title="${escapeHtml(labels[i])}">${escapeHtml(labels[i])}</div>
        <div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div>${b !== null ? `<div class="base" style="width:${(b * 100).toFixed(1)}%"></div>` : ""}</div>
        <div class="pct">${(p * 100).toFixed(1)}%</div></div>`);
    });
    const summary = a.type === "choice" ? `选择：${a.choice}` : a.type === "score" ? `期望分：${a.score}` : `P(true) = ${a.noul}`;
    d.insertAdjacentHTML("beforeend", `<div class="meta">${escapeHtml(summary)} · 置信度 ${a.confidence}${base ? ` · 不看不听时：${escapeHtml(base.type === "choice" ? base.choice : base.type === "score" ? base.score : base.noul)}` : ""}</div>`);
    box.appendChild(d);
  }
  box.insertAdjacentHTML("beforeend", `<div class="meta">耗时 ${j.ms} ms（含编码器） · 图片 ${j.inputs.images} 张 · 音频 ${j.inputs.audio_seconds} 秒 · 每张图 ${j.tokens} 个 token · 输出 token 0</div>`);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// examples
let examples = [], current = "";
fetch("/api/info").then((r) => r.json()).then((info) => { $("detail").checked = !!info.detail; }).catch(() => {});
fetch("/api/examples").then((r) => r.json()).then((ex) => {
  examples = ex; const sets = [...new Set(ex.map((e) => e.set))];
  sets.forEach((s, i) => {
    const b = document.createElement("button"); b.textContent = s;
    b.onclick = () => { current = s; [...$("sets").children].forEach((x) => x.classList.toggle("on", x === b)); renderCards(); };
    $("sets").appendChild(b); if (i === 0) b.click();
  });
  if (!sets.length) $("cards").innerHTML = '<div class="empty">没有配置样例数据</div>';
});
function renderCards() {
  $("cards").innerHTML = "";
  examples.filter((e) => e.set === current).forEach((e) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = (e.image ? `<img src="/api/media?path=${encodeURIComponent(e.image)}">` : `<div class="audio-icon">🔊</div>`) + `<div class="txt">${escapeHtml(e.question.instructions)}</div>`;
    c.onclick = () => loadExample(e); $("cards").appendChild(c);
  });
}
function loadExample(e) {
  state.images = []; state.exampleImages = e.image ? [e.image] : []; renderThumbs();
  state.audio = null; state.exampleAudio = e.audio || "";
  if (e.audio) { $("player").src = "/api/media?path=" + encodeURIComponent(e.audio); $("player").hidden = false; }
  else { $("player").hidden = true; $("player").removeAttribute("src"); }
  $("state").value = e.state; $("questions").innerHTML = ""; addQuestion(e.question); state.answer = e.answer;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
// editing the question by hand clears the known answer
$("questions").addEventListener("input", () => { state.answer = null; });
</script>
</body>
</html>
