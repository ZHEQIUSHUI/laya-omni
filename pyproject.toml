[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-omni"
version = "0.1.0"
description = "Laya typed decisions with optional image and audio inputs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=5.0", "safetensors", "numpy", "tokenizers>=0.21"]

[project.optional-dependencies]
audio = ["librosa", "soundfile", "av"]
image = ["pillow"]
web = ["fastapi", "uvicorn", "python-multipart", "pillow", "librosa", "soundfile", "av"]
train = ["pyarrow", "pillow", "librosa", "soundfile", "av"]
dev = ["pytest"]

[project.scripts]
laya-omni = "laya_omni.cli:main"

[tool.setuptools.packages.find]
include = ["laya_omni*"]

[tool.setuptools.package-data]
laya_omni = ["web/*"]
