[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-omni"
version = "0.1.0"
description = "Laya typed decisions with optional image and audio inputs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.57", "safetensors", "numpy", "tokenizers>=0.21"]

[project.optional-dependencies]
audio = ["qwen-asr", "librosa", "soundfile"]
image = ["pillow"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["laya_omni*"]
